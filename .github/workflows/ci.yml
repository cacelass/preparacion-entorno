name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHONUTF8: "1"

jobs:
  validate-template:
    name: Render + AST (all-pairs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias de validación
        run: pip install jinja2 pyyaml

      - name: Validar copier.yml
        run: python .github/scripts/check_copier.py

      # El generador decide QUE se prueba. Si se rompe en silencio, la
      # cobertura cae y todo sigue en verde.
      - name: Autotest del generador all-pairs
        run: python .github/scripts/pairwise.py --self-test

      - name: Render + AST
        run: python .github/scripts/validate_template.py

  matriz:
    name: Generar matriz smoke
    runs-on: ubuntu-latest
    needs: validate-template
    outputs:
      combos: ${{ steps.gen.outputs.combos }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar pyyaml
        run: pip install pyyaml
      # Falla si algun flag opcional se queda sin ejercitar en ningun combo.
      - name: Cobertura de flags opcionales
        run: python .github/scripts/gen_smoke_matrix.py
      - id: gen
        run: echo "combos=$(python .github/scripts/gen_smoke_matrix.py --json)" >> "$GITHUB_OUTPUT"

  smoke:
    name: smoke (${{ matrix.python-version }}) / ${{ matrix.label }}
    runs-on: ubuntu-latest
    needs: [validate-template, matriz]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matriz.outputs.combos) }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar copier y pyyaml
        run: pip install copier pyyaml

      # Por env, no interpolado en la linea: `matrix.data` es JSON con comillas
      # dobles y rompe el quoting del shell (ademas de evitar inyeccion).
      - name: Escribir data file
        env:
          COMBO_DATA: ${{ matrix.data }}
        run: python .github/scripts/write_data_file.py "$COMBO_DATA"

      - name: Generar proyecto con copier
        run: |
          copier copy --trust --defaults --vcs-ref=HEAD \
            --data-file /tmp/copier-data.yml \
            . /tmp/generated
          ls /tmp/generated

      - name: Smoke tests
        working-directory: /tmp/generated
        run: |
          uv run pytest -m smoke --tb=short -q && rc=0 || rc=$?
          [ $rc -eq 5 ] && echo "No smoke tests — OK" && exit 0
          exit $rc

      - name: Lint
        working-directory: /tmp/generated
        run: uv run ruff check .

      - name: Security scan (Bandit)
        working-directory: /tmp/generated
        run: uv run bandit -r . -f txt -x notebooks,.venv,tests || echo "  (avisos de bandit — revisar si hay falsos positivos)"

      - name: Vulnerability scan (pip-audit)
        working-directory: /tmp/generated
        run: uv run pip-audit 2>/dev/null || echo "  (pip-audit requiere deps instaladas)"

  # `validate-template` prueba que la plantilla renderiza y `smoke` que el
  # proyecto arranca. Nadie probaba que el .github/workflows/ci.yml que le
  # entregamos al usuario PASE — y llevaba roto dos formas distintas: `uv sync
  # --frozen` con uv.lock en el .gitignore, y `mypy --strict` con 193 errores.
  # Este job ejecuta ese workflow tal cual, sobre un clon limpio del proyecto,
  # asi que lo que se rompa se rompe aqui y no en el repositorio de un usuario.
  ci-generado:
    name: CI del proyecto generado
    runs-on: ubuntu-latest
    needs: validate-template
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar copier y pyyaml
        run: pip install copier pyyaml

      # Un proyecto con todos los extras ligeros activos: es el que mas
      # superficie del workflow ejercita (mas `--extra`, mas modulos a tipar).
      # `redes_neuronales` queda fuera a proposito — arrastra torch y el coste
      # no compensa para lo que este job comprueba.
      - name: Generar proyecto
        run: |
          cat > /tmp/ci-data.yml <<'YAML'
          project_name: Proyecto CI
          ml_type: supervisado
          use_api: true
          use_rag: true
          use_monitoring: true
          use_duckdb: true
          use_optuna: true
          graphify_mode: "no"
          YAML
          copier copy --trust --defaults --vcs-ref=HEAD \
            --data-file /tmp/ci-data.yml \
            . /tmp/proyecto-ci

      - name: Ejecutar su CI sobre un clon limpio
        run: python .github/scripts/run_generated_ci.py /tmp/proyecto-ci
