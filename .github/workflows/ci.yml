name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHONUTF8: "1"

jobs:
  validate-template:
    name: Render + AST (1180 checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de validación
        run: pip install jinja2 pyyaml

      - name: Validar copier.yml
        run: python .github/scripts/check_copier.py

      - name: Render + AST
        run: python .github/scripts/validate_template.py

  smoke:
    name: smoke / ${{ matrix.label }}
    runs-on: ubuntu-latest
    needs: validate-template
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: sup-clf
            data: "ml_type=supervisado task_type=clasificacion model_type=todos"
          - label: sup-reg
            data: "ml_type=supervisado task_type=regresion model_type=todos"
          - label: nosup
            data: "ml_type=no_supervisado task_type=clasificacion cluster_model=todos"
          - label: nn-mlp-clf-adamw
            data: "ml_type=redes_neuronales task_type=clasificacion nn_model=MLP optimizer_type=AdamW nn_loss_fn=Auto"
          - label: nn-mlp-reg-sgd-mse
            data: "ml_type=redes_neuronales task_type=regresion nn_model=MLP optimizer_type=SGD nn_loss_fn=MSELoss"
          - label: nn-lstm-clf-rmsprop
            data: "ml_type=redes_neuronales task_type=clasificacion nn_model=LSTM optimizer_type=RMSProp nn_loss_fn=BCEWithLogitsLoss"
          - label: nn-gru-reg-adagrad-l1
            data: "ml_type=redes_neuronales task_type=regresion nn_model=GRU optimizer_type=Adagrad nn_loss_fn=L1Loss"
          - label: nn-transformer-clf
            data: "ml_type=redes_neuronales task_type=clasificacion nn_model=Transformer optimizer_type=AdamW nn_loss_fn=Auto"
          - label: hibrido-clf
            data: "ml_type=hibrido task_type=clasificacion model_type=todos"
          - label: hibrido-reg
            data: "ml_type=hibrido task_type=regresion model_type=todos"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar copier y pyyaml
        run: pip install copier pyyaml

      - name: Escribir data file
        run: python .github/scripts/write_data_file.py "${{ matrix.data }}"

      - name: Generar proyecto con copier
        run: |
          copier copy --trust --defaults \
            --data-file /tmp/copier-data.yml \
            . /tmp/generated
          ls /tmp/generated

      - name: Smoke tests
        working-directory: /tmp/generated
        run: |
          uv run pytest -m smoke --tb=short -q && rc=0 || rc=$?
          [ $rc -eq 5 ] && echo "No smoke tests — OK" && exit 0
          exit $rc

      - name: Lint
        working-directory: /tmp/generated
        run: uv run ruff check .