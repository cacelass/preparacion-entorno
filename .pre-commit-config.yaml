repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
        exclude: template/
      - id: ruff-format
        exclude: template/

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile, black, --filter-files]
        # template/ es Jinja, no Python: isort reescribio
        # `from {{ project_slug }}...` a `from {{project_slug}}...` y con
        # imports dentro de un {% if %} corromperia el template. El resto de
        # hooks que reescriben codigo ya lo excluian; este se habia quedado.
        exclude: template/

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-r, -f, txt, -x, template/,.venv,tests]
        stages: [push]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args: [--strict]
        additional_dependencies: [types-PyYAML]
        stages: [push]
        exclude: template/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: template/
      - id: check-toml
        exclude: template/
      - id: check-added-large-files
      - id: check-merge-conflict
