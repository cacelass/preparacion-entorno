# CI workflow for {{ project_name }}
# Generated by dskit (https://github.com/cacelass/dskit)

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["{{ python_version }}"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: {% raw %}${{ matrix.python-version }}{% endraw %}

      - name: Install dependencies
        run: uv sync --extra dev --extra {{ ml_type }} \
{% if use_mlflow %}          --extra mlflow_tracking \
{% endif %}{% if graphify_mode != 'no' %}          --extra graphify \
{% endif %}{% if use_api %}          --extra api \
{% endif %}{% if use_duckdb %}          --extra duckdb \
{% endif %}{% if use_optuna %}          --extra optuna \
{% endif %}{% if use_monitoring %}          --extra monitoring \
{% endif %}            --frozen

      - name: Lint
        run: uv run ruff check {{ project_slug }}/ tests/

      - name: Type check
        run: uv run mypy --strict {{ project_slug }}/ tests/

      - name: Test with coverage
        run: uv run pytest tests/ -v --cov={{ project_slug }} --cov-report=xml --cov-fail-under=20

      - name: Agent tests
        run: uv run pytest agents/tests/ -v --tb=short
        continue-on-error: true

      # La puerta del arnés, en CI. Sin --quick no aportaría nada: los tests
      # ya se ejecutaron arriba y el fallo saldría dos veces.
      - name: Harness gate
        run: |
          chmod +x init.sh
          ./init.sh --quick

      # Los prompts de los agentes se derivan del código y de contracts.py.
      # Si alguien añade una acción y no regenera, esto lo caza.
      - name: Prompts in sync
        run: uv run python -m agents.prompts_sync

      - name: Agent evals
        run: uv run python -m agents.evals.runner --json
        continue-on-error: true

      - name: Security scan
        run: uv run bandit -r {{ project_slug }}/ -f txt -x tests || true
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
