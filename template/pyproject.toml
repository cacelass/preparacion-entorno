[project]
name = "{{ project_slug }}"
version = "{{ project_version }}"
description = "{{ project_description }}"
authors = [
  { name = "{{ project_author_name }}" }
]
readme = "README.md"
requires-python = ">= {{ python_version }}"
license = { text = "{{ project_open_source_license if project_open_source_license != 'No license file' else '' }}" }
dependencies = [
    # ── Datos y computación ───────────────────────────────────────────────
    "numpy>=1.26",
    "pandas",
    "scipy",           # stats, tests de normalidad, clustering jerárquico
    # ── ML core (usadas en todos los ml_type) ────────────────────────────
    "scikit-learn>=1.3",    # modelos, PCA, pipelines, métricas, preprocesado
    "joblib",          # serialización de modelos y paralelismo
    # ── Visualización ────────────────────────────────────────────────────
    "matplotlib",
    "seaborn",
    "plotly",
    "missingno",
    # ── Notebooks ────────────────────────────────────────────────────────
    "jupyter",
    "jupyterlab",
    # ── Utilidades ───────────────────────────────────────────────────────
    "python-dotenv",
    "loguru",          # logging estructurado
    "rich",            # output de consola con color y tablas
    "tqdm",            # barras de progreso
]

[project.optional-dependencies]
dev = [
    "bandit",
    "black",
    "hypothesis",
    "invoke",
    "isort",
    "mypy",
    "nbdime",
    "pip-audit",
    "pre-commit",
    "radon",
    "ruff",
    "pytest",
    "pytest-cov",
    "sphinx",
    "sphinx-rtd-theme",
    "myst-parser",
    "snakeviz",
]

# ML supervisado: clasificación + regresión
supervisado = [
    "lightgbm",
    "xgboost",
{% if use_catboost or model_type == "CatBoost" %}
    "catboost",
{% endif %}
    "statsmodels",
    "imbalanced-learn",
{% if use_shap %}
    "shap>=0.46,<2.0",
    "numba>=0.59",
{% endif %}
]

{% if use_mlflow %}
mlflow_tracking = [
    "mlflow>=2.10,<3.0",
]
{% endif %}

# ML no supervisado: clustering + reducción de dimensionalidad
no_supervisado = [
    "yellowbrick>=1.5",       # SilhouetteVisualizer
    "umap-learn>=0.5.7", # reducción de dimensionalidad no lineal (UMAP)
    "pynndescent>=0.5.12", # dependencia de umap-learn — pin explícito
    "numba>=0.59",       # dependencia de pynndescent — evita resolver llvmlite antiguo
    "hdbscan",           # clustering basado en densidad jerárquico
]

# Redes neuronales: deep learning con PyTorch
redes_neuronales = [
    "torch>=2.0",
    "torchmetrics[visual]",
    "tensorboard",
    "captum>=0.7",    # explicabilidad (Integrated Gradients, LayerIG)
    "polars",         # carga eficiente de datos con dtypes explícitos
    "pyarrow",        # backend requerido por polars para conversión a pandas
]

# Modelos híbridos: combinan técnicas supervisadas y no supervisadas
hibrido = [
    "umap-learn>=0.5.7",   # UMAP como alternativa a PCA (no lineal)
    "pynndescent>=0.5.12", # dependencia de umap-learn — pin explícito
    "numba>=0.59",         # dependencia de pynndescent — evita resolver llvmlite antiguo
    "lightgbm",             # clasificador final potente
    "xgboost",               # clasificador final alternativo
{% if use_catboost or model_type == "CatBoost" %}
    "catboost",       # boosting nativo para variables categoricas
{% endif %}
    "imbalanced-learn",
{% if use_shap %}
    "shap>=0.46,<2.0",
    "numba>=0.59",
{% endif %}
]

{% if use_optuna %}
# Optuna: optimizacion de hiperparametros
optuna = [
    "optuna",
    "optuna-dashboard",  # UI web para explorar estudios (opcional)
]
{% endif %}

{% if use_duckdb %}
# DuckDB: queries SQL sobre CSV/Parquet/JSON sin servidor
duckdb = [
    "duckdb",
    "pyarrow",   # necesario para leer/escribir Parquet con pandas y DuckDB
]
{% endif %}

{% if use_api %}
# API REST para servir el modelo entrenado
api = [
    "fastapi>=0.100",
    "uvicorn[standard]",
    "pydantic>=2.0,<3.0",
    "httpx>=0.27,<1.0",  # necesario para TestClient de FastAPI
]
{% endif %}

{% if use_monitoring %}
# Monitorización: drift detection y performance tracking
monitoring = [
    "evidently>=0.4,<1.0",
    # nltk entra de forma transitiva por evidently. La 3.10.1 trae un hook de
    # importación (`nltk/inisec.py`) contra el secuestro de módulos desde el
    # directorio actual (CWE-427) que está roto: bloquea importaciones que NO
    # vienen del CWD —desde otro directorio llega a bloquear `locale`, de la
    # stdlib— así que un simple `import nltk` revienta y con él `import
    # evidently`. El remedio que sugiere el propio error (`-P`,
    # `PYTHONSAFEPATH=1`) tampoco funciona; verificado que 3.9.2 y 3.10.0 sí
    # importan. Se excluye solo esa versión para que la corrección de upstream
    # entre sola.
    "nltk!=3.10.1",
]
{% endif %}

{% if graphify_mode != 'no' %}
# Graphify: grafo de conocimiento del proyecto.
# El paquete en PyPI se llama `graphifyy` (con doble y); el modulo que se
# importa es `graphify`. No son lo mismo, y poner el del import hacia que
# `uv sync` no resolviera: no existe ningun paquete llamado `graphify`.
# Requiere GEMINI_API_KEY en .env para extracción semántica vía Gemini.
graphify = [
    "graphifyy[gemini]",
]
{% endif %}

{% if use_rag %}
# RAG: búsqueda híbrida local (vector + BM25) con ChromaDB
# Modelo all-MiniLM-L6-v2 vía ONNX (descarga única ~80MB, sin GPU ni API key).
# El suelo es 0.5.0: por debajo la API de colecciones es otra y el índice no
# llega a crearse. El techo evita que un major de chroma rompa el arnés solo.
rag = [
    "chromadb>=0.5.0,<2.0",
    # markitdown convierte PDFs de arXiv a markdown en `rag refresh` (para
    # papers sin versión HTML). Es import opcional: si no está, refresh
    # degrada a "solo papers con HTML" y avisa.
    "markitdown[pdf]>=0.1",
]

# Embeddings multilingües de verdad: all-MiniLM-L6-v2 está entrenado en inglés
# y este proyecto se documenta en español. Cuesta arrastrar torch, así que es
# opt-in: instala este extra y exporta DSKIT_RAG_EMBEDDER=multilingual.
# Al cambiar de embedder hay que reconstruir: `rag index --rebuild`.
rag_multilingual = [
    "chromadb>=0.5.0,<2.0",
    "sentence-transformers>=2.2",
]
{% endif %}

[tool.setuptools]
packages = ["{{ project_slug }}"]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short --cov={{ project_slug }} --cov-report=term-missing"
markers   = [
    "smoke: test de humo — verifica que el pipeline arranca sin errores con datos sintéticos",
]

[tool.ruff]
line-length = 165
target-version = "{{ 'py' + python_version | replace('.', '') }}"
exclude = [
    "notebooks/",
    ".venv",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "I001",   # import sorting — templates can't guarantee alphabetical order
    "F401",   # imported but unused — template imports are intentionally broad
    "F811",   # redefinition of unused — happens in generated multi-cell notebooks
    "F541",   # f-string without placeholders — happens after Jinja substitution
]

[tool.ruff.lint.per-file-ignores]
"tests/*"  = ["F401", "F811", "E402", "F841"]
"docs/*"   = ["E402", "W292"]
# E402 aqui no es un descuido. Son dos causas legitimas:
#   1. Los bloques condicionales de la plantilla colocan imports a mitad de
#      fichero segun las opciones elegidas — asi funciona la generacion.
#   2. `warnings.filterwarnings()` y `optuna.logging.set_verbosity()` tienen
#      que ejecutarse ANTES de importar las librerias ruidosas; moverlos
#      arriba les quitaria el efecto.
# W293: linea en blanco con sangria que deja el motor de plantillas al
# colapsar un bloque condicional. `make format` la limpia.
"tuning/tune_model.py"    = ["E402", "W293"]
"monitoring/monitor.py"   = ["E402"]
"{{ project_slug }}/models/predict_model.py" = ["E402"]

[tool.isort]
profile = "black"
line_length = 165
skip = ["notebooks", ".venv", "dist"]

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = ["notebooks/", ".venv"]

# Los tests se comprueban, pero no en modo estricto. Anotar `-> None` en cada
# `def test_...` y tipar cada fixture son 155 anotaciones que no atrapan ni un
# solo bug: el valor de mypy está en el código que se despliega, no en los
# asserts. Dejarlo estricto aquí era peor que no tenerlo — el gate llevaba
# tanto tiempo en rojo que nadie lo miraba.
[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[tool.bandit]
exclude_dirs = ["notebooks", ".venv", "tests", "docs"]
skips = ["B101", "B404", "B603", "B113"]

[tool.radon]
max_cc = 10
exclude = ["notebooks/", ".venv", "tests/", "docs/"]

[[tool.radon.halstead]]
exclude = ["notebooks/", ".venv", "tests/", "docs/"]
