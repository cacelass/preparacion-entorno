[project]
name = "{{ project_slug }}"
version = "{{ project_version }}"
description = "{{ project_description }}"
authors = [
  { name = "{{ project_author_name }}" }
]
readme = "README.md"
requires-python = ">= {{ python_version }}"
license = { text = "{{ project_open_source_license if project_open_source_license != 'No license file' else '' }}" }
dependencies = [
    # ── Datos y computación ───────────────────────────────────────────────
    "numpy>=1.26",
    "pandas",
    "scipy",           # stats, tests de normalidad, clustering jerárquico
    # ── ML core (usadas en todos los ml_type) ────────────────────────────
    "scikit-learn>=1.3",    # modelos, PCA, pipelines, métricas, preprocesado
    "joblib",          # serialización de modelos y paralelismo
    # ── Visualización ────────────────────────────────────────────────────
    "matplotlib",
    "seaborn",
    "plotly",
    "missingno",
    # ── Notebooks ────────────────────────────────────────────────────────
    "jupyter",
    "jupyterlab",
    # ── Utilidades ───────────────────────────────────────────────────────
    "python-dotenv",
    "loguru",          # logging estructurado
    "rich",            # output de consola con color y tablas
    "tqdm",            # barras de progreso
]

[project.optional-dependencies]
dev = [
    "invoke",
    "mypy",
    "nbdime",
    "ruff",
    "pytest",
    "pytest-cov",
    "sphinx",
    "sphinx-rtd-theme",
    "myst-parser",
    "snakeviz",
]

# ML supervisado: clasificación + regresión
supervisado = [
    "lightgbm",
    "xgboost",
{% if use_catboost or model_type == "CatBoost" %}
    "catboost",
{% endif %}
    "statsmodels",
    "imbalanced-learn",
{% if use_shap %}
    "shap>=0.46,<2.0",
    "numba>=0.59",
{% endif %}
]

{% if use_mlflow %}
mlflow_tracking = [
    "mlflow>=2.10,<3.0",
]
{% endif %}

# ML no supervisado: clustering + reducción de dimensionalidad
no_supervisado = [
    "yellowbrick>=1.5",       # SilhouetteVisualizer
    "umap-learn>=0.5.7", # reducción de dimensionalidad no lineal (UMAP)
    "pynndescent>=0.5.12", # dependencia de umap-learn — pin explícito
    "numba>=0.59",       # dependencia de pynndescent — evita resolver llvmlite antiguo
    "hdbscan",           # clustering basado en densidad jerárquico
]

# Redes neuronales: deep learning con PyTorch
redes_neuronales = [
    "torch>=2.0",
    "torchmetrics[visual]",
    "tensorboard",
    "polars",         # carga eficiente de datos con dtypes explícitos
    "pyarrow",        # backend requerido por polars para conversión a pandas
]

# Modelos híbridos: combinan técnicas supervisadas y no supervisadas
hibrido = [
    "umap-learn>=0.5.7",   # UMAP como alternativa a PCA (no lineal)
    "pynndescent>=0.5.12", # dependencia de umap-learn — pin explícito
    "numba>=0.59",         # dependencia de pynndescent — evita resolver llvmlite antiguo
    "lightgbm",             # clasificador final potente
    "xgboost",               # clasificador final alternativo
{% if use_catboost or model_type == "CatBoost" %}
    "catboost",       # boosting nativo para variables categoricas
{% endif %}
    "imbalanced-learn",
{% if use_shap %}
    "shap>=0.46,<2.0",
    "numba>=0.59",
{% endif %}
]

{% if use_optuna %}
# Optuna: optimizacion de hiperparametros
optuna = [
    "optuna",
    "optuna-dashboard",  # UI web para explorar estudios (opcional)
]
{% endif %}

{% if use_duckdb %}
# DuckDB: queries SQL sobre CSV/Parquet/JSON sin servidor
duckdb = [
    "duckdb",
    "pyarrow",   # necesario para leer/escribir Parquet con pandas y DuckDB
]
{% endif %}

{% if use_api %}
# API REST para servir el modelo entrenado
api = [
    "fastapi>=0.100",
    "uvicorn[standard]",
    "pydantic>=2.0,<3.0",
    "httpx>=0.27,<1.0",  # necesario para TestClient de FastAPI
]
{% endif %}

{% if use_monitoring %}
# Monitorización: drift detection y performance tracking
monitoring = [
    "evidently>=0.4,<1.0",
]
{% endif %}

{% if graphify_mode != 'no' %}
# Graphify: grafo de conocimiento del proyecto (github.com/anomalyco/graphify)
# Requiere GEMINI_API_KEY en .env para extracción semántica vía Gemini
graphify = [
    "graphify[gemini]",
]
{% endif %}

[tool.setuptools]
packages = ["{{ project_slug }}"]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
markers   = [
    "smoke: test de humo — verifica que el pipeline arranca sin errores con datos sintéticos",
]

[tool.ruff]
line-length = 120
target-version = "{{ 'py' + python_version | replace('.', '') }}"
exclude = [
    "notebooks/",
    ".venv",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "I001",   # import sorting — templates can't guarantee alphabetical order
    "F401",   # imported but unused — template imports are intentionally broad
    "F811",   # redefinition of unused — happens in generated multi-cell notebooks
    "F541",   # f-string without placeholders — happens after Jinja substitution
]

[tool.ruff.lint.per-file-ignores]
"tests/*"  = ["F401", "F811", "E402", "F841"]
"docs/*"   = ["E402", "W292"]