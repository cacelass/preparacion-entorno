# copier.yml - dskit template configuration
# Docs: https://copier.readthedocs.io

# --- Configuracion global ---
# Genera .copier-answers.yml en el proyecto destino.
# Permite actualizar el proyecto en el futuro con: copier update
_answers_file: .copier-answers.yml

# --- Proyecto ---
project_name:
  type: str
  default: Proyecto
  help: "Nombre del proyecto (espacios y guiones se convierten a _ en el slug)"

project_slug:
  type: str
  default: "{{ project_name | lower | replace(' ', '_') | replace('-', '_') }}"
  help: "Nombre del paquete Python (generado automaticamente, no cambiar)"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9_]*$')) %}
    El slug solo puede contener letras minusculas, numeros y _
    {% elif project_slug in ['mlflow', 'optuna', 'sklearn', 'torch', 'numpy', 'pandas', 'scipy', 'fastapi', 'duckdb', 'xgboost', 'lightgbm', 'shap', 'joblib', 'pytest', 'ruff', 'uv'] %}
    El nombre '{{ project_slug }}' colisiona con una libreria Python. Elige otro nombre de proyecto.
    {% endif %}

project_author_name:
  type: str
  default: Nombre del autor
  help: "Nombre del autor"

project_author_email:
  type: str
  default: email@ejemplo.com
  help: "Email del autor"
  validator: >-
    {% if '@' not in project_author_email or '.' not in project_author_email.split('@')[-1] %}
    Introduce un email valido (ej: nombre@dominio.com)
    {% endif %}

project_description:
  type: str
  default: "Descripcion breve del proyecto."
  help: "Descripcion breve"

# --- Tipo de ML ---
ml_type:
  type: str
  help: "Tipo de ML: supervisado | no_supervisado | redes_neuronales | hibrido"
  choices:
    - supervisado
    - no_supervisado
    - redes_neuronales
    - hibrido
  default: supervisado

# --- Tipo de tarea (clasificacion o regresion) ---
task_type:
  type: str
  help: "clasificacion = clases discretas | regresion = valor continuo"
  choices:
    - clasificacion
    - regresion
  default: clasificacion
  when: "{{ ml_type == 'supervisado' or ml_type == 'redes_neuronales' or ml_type == 'hibrido' }}"

# --- MLflow (tracking de experimentos) ---
use_mlflow:
  type: bool
  help: "Integrar MLflow para tracking de experimentos, artifacts y Model Registry?"
  default: false


# --- Arquitectura de red neuronal (solo redes_neuronales) ---
nn_model:
  type: str
  help: "Arquitectura: MLP | CNN1D | LSTM | GRU | Transformer"
  choices:
    - MLP
    - CNN1D
    - LSTM
    - GRU
    - Transformer
  default: MLP
  when: "{{ ml_type == 'redes_neuronales' }}"

# --- Optimizador (solo redes_neuronales) ---
optimizer_type:
  type: str
  help: "Optimizador PyTorch: AdamW (recomendado) | Adam | SGD | RMSProp | Adagrad"
  choices:
    - AdamW
    - Adam
    - SGD
    - RMSProp
    - Adagrad
  default: AdamW
  when: "{{ ml_type == 'redes_neuronales' }}"

# --- Función de pérdida (solo redes_neuronales) ---
nn_loss_fn:
  type: str
  help: "Función de pérdida (Auto = CrossEntropy para clasificación, MSE para regresión)"
  choices:
    - Auto
    - CrossEntropyLoss
    - MSELoss
    - L1Loss
    - BCEWithLogitsLoss
  default: Auto
  when: "{{ ml_type == 'redes_neuronales' }}"

# --- Modelo activo (solo supervisado e hibrido) ---
model_type:
  type: str
  help: "todos = entrena y compara todos | otro = solo ese modelo"
  choices:
    - todos
    - RandomForest
    - XGBoost
    - LightGBM
    - CatBoost
    - LogisticRegression
    - KNN
    - DecisionTree
    - SVM
  default: todos
  when: "{{ ml_type == 'supervisado' or ml_type == 'hibrido' }}"

cluster_model:
  type: str
  help: "todos = ajusta todos los modelos de clustering | otro = solo ese"
  choices:
    - todos
    - KMeans
    - AgglomerativeClustering
  default: todos
  when: "{{ ml_type == 'no_supervisado' }}"

# --- Monitoring ---
use_monitoring:
  type: bool
  help: "Añadir modulo de monitorizacion? (drift detection, performance tracking, make monitor)"
  default: false

# --- Optuna ---
use_optuna:
  type: bool
  help: "Añadir optimizacion de hiperparametros con Optuna? (make tune)"
  default: false

# --- DuckDB ---
use_duckdb:
  type: bool
  help: "Añadir carga de datos con DuckDB? (CSV/Parquet/JSON con SQL, muy rapido en datasets grandes)"
  default: false

# --- API REST (FastAPI) ---
use_api:
  type: bool
  help: "Generar API REST con FastAPI para servir el modelo entrenado? (make serve)\n         Requiere ejecutar make train antes de make serve. La API arranca aunque no haya modelo,\n         pero /predict devolverá 503 hasta que haya pesos en models/."
  default: false

# --- Docker (interfaz web de chat) ---
use_docker:
  type: bool
  help: "Generar configuracion Docker con interfaz web de chat para el modelo? (make docker-run)"
  default: false

# --- Explicabilidad ---

use_shap:
  type: bool
  help: "Añadir SHAP (explicabilidad de modelos)? Genera bar + beeswarm por modelo."
  default: false
  when: "{{ ml_type == 'supervisado' or ml_type == 'hibrido' }}"

# --- Boosting opcional (solo supervisado e hibrido) ---
use_xgboost:
  type: bool
  help: "Añadir XGBoost a _build_models()?"
  default: false
  when: "{{ ml_type == 'supervisado' or ml_type == 'hibrido' }}"

use_lightgbm:
  type: bool
  help: "Añadir LightGBM a _build_models()?"
  default: false
  when: "{{ ml_type == 'supervisado' or ml_type == 'hibrido' }}"

use_catboost:
  type: bool
  help: "Añadir CatBoost a _build_models()? (boosting nativo para categoricas)"
  default: false
  when: "{{ ml_type == 'supervisado' or ml_type == 'hibrido' }}"

# --- Licencia y versiones ---
project_open_source_license:
  type: str
  help: "Licencia del proyecto"
  choices:
    - No license file
    - MIT
    - BSD-3-Clause
  default: No license file

python_version:
  type: str
  help: "Version de Python"
  choices:
    - "3.10"
    - "3.11"
    - "3.12"
    - "3.13"
  default: "3.12"

project_version:
  type: str
  default: "0.1.0"
  help: "Version inicial del proyecto"

# --- Tareas post-generacion ---

_message_before_copy: >-
  {% if use_api and ml_type == 'no_supervisado' %}
    AVISO: use_api=yes con ml_type=no_supervisado — el endpoint /predict
  devuelve cluster asignado. Asegúrate de que predict_model.py tiene el método predict().
  {% endif %}
  Generando proyecto '{{ project_name }}' ({{ ml_type }})...

_tasks:
  - "uv sync --extra dev --extra {{ ml_type }}{% if use_mlflow %} --extra mlflow_tracking{% endif %}{% if use_api %} --extra api{% endif %}{% if use_duckdb %} --extra duckdb{% endif %}{% if use_optuna %} --extra optuna{% endif %}{% if use_monitoring %} --extra monitoring{% endif %} && uv run python -c 'import sklearn; print(\"scikit-learn OK\")' {% if ml_type == 'redes_neuronales' %}&& uv run python -c 'import torch; print(\"torch\", torch.__version__)' {% endif %}{% if use_optuna %}&& uv run python -c 'import optuna; print(\"optuna\", optuna.__version__)' {% endif %}{% if use_monitoring %}&& uv run python -c 'import evidently; print(\"evidently\", evidently.__version__)' {% endif %}"
_exclude:
  - "{% if not use_api %}api{% endif %}"
  - "{% if not use_api %}tests/test_api.py{% endif %}"
  - "{% if not use_optuna %}tuning{% endif %}"
  - "{% if not use_optuna %}tests/test_tuning.py{% endif %}"
  - "{% if not use_monitoring %}monitoring{% endif %}"
  - "{% if not use_monitoring %}tests/test_monitoring.py{% endif %}"
  - "{% if not use_docker %}chat{% endif %}"
  - "{% if not use_docker %}Dockerfile{% endif %}"
  - "{% if not use_docker %}docker-compose.yml{% endif %}"
  - "{% if not use_docker %}.dockerignore{% endif %}"

_subdirectory: template
_templates_suffix: ""