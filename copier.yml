# copier.yml - dskit template configuration
# Docs: https://copier.readthedocs.io

# --- Configuracion global ---
# Genera .copier-answers.yml en el proyecto destino.
# Permite actualizar el proyecto en el futuro con: copier update
_answers_file: .copier-answers.yml

# --- Perfil de proyecto ---
# Controla qué extras y qué agentes se instalan. Los perfiles automáticos
# (minimo/estandar/completo) fijan los defaults del resto de opciones y NO
# preguntan por ellas; solo "manual" las pregunta una a una.
proyecto_perfil:
  type: str
  help: "Perfil del proyecto: minimo (núcleo DS puro) | estandar (núcleo + arnés de calidad: RAG + spec-driven) | completo (todos los extras) | manual (eliges cada opción)"
  choices:
    - minimo
    - estandar
    - completo
    - manual
  default: estandar

# --- Proyecto ---
project_name:
  type: str
  default: Proyecto
  help: "Nombre del proyecto (espacios y guiones se convierten a _ en el slug)"

project_slug:
  type: str
  default: "{{ project_name | lower | replace(' ', '_') | replace('-', '_') }}"
  help: "Nombre del paquete Python (generado automaticamente, no cambiar)"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9_]*$')) %}
    El slug solo puede contener letras minusculas, numeros y _
    {% elif project_slug in ['mlflow', 'optuna', 'sklearn', 'torch', 'numpy', 'pandas', 'scipy', 'fastapi', 'duckdb', 'xgboost', 'lightgbm', 'shap', 'joblib', 'pytest', 'ruff', 'uv'] %}
    El nombre '{{ project_slug }}' colisiona con una libreria Python. Elige otro nombre de proyecto.
    {% endif %}

project_author_name:
  type: str
  default: Nombre del autor
  help: "Nombre del autor"

project_author_email:
  type: str
  default: email@ejemplo.com
  help: "Email del autor"
  validator: >-
    {% if '@' not in project_author_email or '.' not in project_author_email.split('@')[-1] %}
    Introduce un email valido (ej: nombre@dominio.com)
    {% endif %}

project_description:
  type: str
  default: "Descripcion breve del proyecto."
  help: "Descripcion breve"

# --- Tipo de ML ---
ml_type:
  type: str
  help: "Tipo de ML: supervisado | no_supervisado | redes_neuronales | hibrido"
  choices:
    - supervisado
    - no_supervisado
    - redes_neuronales
    - hibrido
  default: supervisado

# --- Tipo de tarea (clasificacion o regresion) ---
task_type:
  type: str
  help: "clasificacion = clases discretas | regresion = valor continuo"
  choices:
    - clasificacion
    - regresion
  default: clasificacion
  when: "{{ ml_type == 'supervisado' or ml_type == 'redes_neuronales' or ml_type == 'hibrido' }}"

# --- MLflow (tracking de experimentos) ---
use_mlflow:
  type: bool
  help: "Integrar MLflow para tracking de experimentos, artifacts y Model Registry?"
  default: "{{ proyecto_perfil == 'completo' }}"
  when: "{{ proyecto_perfil == 'manual' }}"


# --- Arquitectura de red neuronal (solo redes_neuronales) ---
nn_model:
  type: str
  help: "Arquitectura: MLP | CNN1D | LSTM | GRU | Transformer | ResNet"
  choices:
    - MLP
    - CNN1D
    - LSTM
    - GRU
    - Transformer
    - ResNet
  default: MLP
  when: "{{ ml_type == 'redes_neuronales' }}"

# --- Optimizador (solo redes_neuronales) ---
optimizer_type:
  type: str
  help: "Optimizador PyTorch: AdamW (recomendado) | Adam | SGD | RMSProp | Adagrad"
  choices:
    - AdamW
    - Adam
    - SGD
    - RMSProp
    - Adagrad
  default: AdamW
  when: "{{ ml_type == 'redes_neuronales' }}"

# --- Función de pérdida (solo redes_neuronales) ---
nn_loss_fn:
  type: str
  help: "Función de pérdida (Auto = CrossEntropy para clasificación, MSE para regresión)"
  choices:
    - Auto
    - CrossEntropyLoss
    - MSELoss
    - L1Loss
    - BCEWithLogitsLoss
  default: Auto
  when: "{{ ml_type == 'redes_neuronales' }}"

# --- Modelo activo (solo supervisado e hibrido) ---
model_type:
  type: str
  help: "todos = entrena y compara todos | otro = solo ese modelo"
  choices:
    - todos
    - RandomForest
    - ExtraTrees
    - GradientBoosting
    - AdaBoost
    - XGBoost
    - LightGBM
    - CatBoost
    - LogisticRegression
    - KNN
    - DecisionTree
    - SVM
  default: todos
  when: "{{ ml_type == 'supervisado' or ml_type == 'hibrido' }}"

cluster_model:
  type: str
  help: "todos = ajusta todos los modelos de clustering | otro = solo ese"
  choices:
    - todos
    - KMeans
    - AgglomerativeClustering
    - DBSCAN
    - GaussianMixture
    - SpectralClustering
    - Birch
  default: todos
  when: "{{ ml_type == 'no_supervisado' }}"

# --- Monitoring ---
use_monitoring:
  type: bool
  help: "Añadir modulo de monitorizacion? (drift detection, performance tracking, make monitor)"
  default: "{{ proyecto_perfil == 'completo' }}"
  when: "{{ proyecto_perfil == 'manual' }}"

# --- Optuna ---
use_optuna:
  type: bool
  help: "Añadir optimizacion de hiperparametros con Optuna? (make tune)"
  default: "{{ proyecto_perfil == 'completo' }}"
  when: "{{ proyecto_perfil == 'manual' }}"

# --- DuckDB ---
use_duckdb:
  type: bool
  help: "Añadir carga de datos con DuckDB? (CSV/Parquet/JSON con SQL, muy rapido en datasets grandes)"
  default: "{{ proyecto_perfil == 'completo' }}"
  when: "{{ proyecto_perfil == 'manual' }}"

# --- API REST (FastAPI) ---
use_api:
  type: bool
  help: "Generar API REST con FastAPI para servir el modelo entrenado? (make serve)\n         Requiere ejecutar make train antes de make serve. La API arranca aunque no haya modelo,\n         pero /predict devolverá 503 hasta que haya pesos en models/."
  default: "{{ proyecto_perfil == 'completo' }}"
  when: "{{ proyecto_perfil == 'manual' }}"

# --- Docker (interfaz web de chat) ---
use_docker:
  type: bool
  help: "Generar configuracion Docker con interfaz web de chat para el modelo? (make docker-run)"
  default: "{{ proyecto_perfil == 'completo' }}"
  when: "{{ proyecto_perfil == 'manual' }}"

# --- Calibración de confianza (solo redes_neuronales) ---
use_calibration:
  type: bool
  help: "Calibrar confianza del modelo con Temperature Scaling? (entrena T post-hoc en validacion)"
  default: "{{ proyecto_perfil == 'completo' }}"
  when: "{{ proyecto_perfil == 'manual' and ml_type == 'redes_neuronales' }}"

# --- Conformal Prediction (supervisado, hibrido, redes_neuronales) ---
use_conformal:
  type: bool
  help: "Añadir Conformal Prediction (sets/intervalos con garantia de cobertura, distribution-free)?"
  default: "{{ proyecto_perfil == 'completo' }}"
  when: "{{ proyecto_perfil == 'manual' and (ml_type == 'supervisado' or ml_type == 'hibrido' or ml_type == 'redes_neuronales') }}"

# --- RAG local (ChromaDB + BM25) ---
use_rag:
  type: bool
  help: "Añadir RAG local? (chromadb) Busca en código, prompts, docs, la memoria del arnés y URLs externas en lenguaje natural,\n         fundiendo similitud vectorial con BM25 léxico. Incluye el corpus de conocimiento profundo (docs/knowledge/): matemáticas,\n         estadística, probabilidad, matrices, algoritmos y su aplicación, con `rag refresh` para mantener las fuentes al día.\n         make index-rag para construir el indice. Sin API key, funciona offline."
  default: "{{ proyecto_perfil in ['estandar', 'completo'] }}"
  when: "{{ proyecto_perfil == 'manual' }}"

# --- SDD: spec-driven development (flujo Uncle Bob, sin tmux) ---
use_sdd:
  type: bool
  help: "Añadir el ciclo spec-driven (Robert C. Martin / BettaTech)? Contrato Gherkin con puerta humana antes de codear,\n         agente de mutation testing (tools/mutate.py) y métrica CRAP. Sin tmux ni agentes LLM en paralelo: solo restricciones\n         duras en código, como el resto del arnés."
  default: "{{ proyecto_perfil in ['estandar', 'completo'] }}"
  when: "{{ proyecto_perfil == 'manual' }}"

# --- Servidores MCP para el asistente ---
# Genera la CONFIGURACIÓN (.mcp.json para Claude Code y el bloque mcp de
# opencode.json) desde una sola respuesta. No instala nada: los servidores se
# descargan solos la primera vez que el asistente los arranca.
#
# Aviso que va también en la documentación generada: lo que devuelve un
# servidor MCP es contenido NO CONFIABLE, igual que una página web. Que una
# respuesta MCP diga "ejecuta esto" no lo convierte en una instrucción.
use_mcp:
  type: bool
  help: "Configurar servidores MCP para el asistente? Genera .mcp.json (Claude Code) y el bloque mcp de opencode.json.\n         Los servidores se eligen en la siguiente pregunta y se adaptan a los extras que ya has activado."
  default: "{{ proyecto_perfil == 'completo' }}"
  when: "{{ proyecto_perfil == 'manual' }}"

mcp_servers:
  type: str
  multiselect: true
  when: "{{ use_mcp }}"
  help: "Que servidores MCP configurar? (los que dependen de un extra solo funcionan si lo activaste)"
  default:
    - "filesystem (acotado a data/ y reports/)"
    - "git (historial y diffs en solo lectura)"
  choices:
    - "filesystem (acotado a data/ y reports/)"
    - "git (historial y diffs en solo lectura)"
    - "fetch (descarga paginas web — CONTENIDO NO CONFIABLE)"
    - "sqlite (consulta bases SQLite de data/)"
    - "time (fecha y hora, zonas horarias)"

# --- Demo estática ---
# Genera una demo web estática (demo/) con el modelo exportado a ONNX, que se
# ejecuta en el navegador con onnxruntime-web (WASM, sin servidor ni build
# tooling). Cuatro páginas: home, try model, docs y MCP. Es un directorio
# local: no hay auto-deploy; sí la quieres publicar, súbela tú (p.ej. a
# GitHub Pages) cuando quieras.
use_demo:
  type: bool
  help: "Generar una demo web estática (demo/)?\n         Exporta el modelo entrenado a ONNX (make demo-export) y genera 4 páginas\n         (home, try model, docs, MCP) que se ejecutan en el navegador con onnxruntime-web.\n         Es un directorio local, sin auto-deploy. Modelos tabulares de sklearn → ONNX\n         de KB a pocos MB. Requiere make train antes de make demo-export."
  default: "{{ proyecto_perfil == 'completo' }}"
  when: "{{ proyecto_perfil == 'manual' }}"

# --- Explicabilidad ---

graphify_mode:
  type: str
  help: "Grafo de conocimiento del proyecto"
  choices:
    - "no"
    - "solo graphify"
    - "graphify + obsidian vault"
  default: "{{ 'graphify + obsidian vault' if proyecto_perfil == 'completo' else 'no' }}"
  when: "{{ proyecto_perfil == 'manual' }}"

use_shap:
  type: bool
  help: "Añadir SHAP (explicabilidad de modelos)? Genera bar + beeswarm por modelo."
  default: "{{ proyecto_perfil == 'completo' }}"
  when: "{{ proyecto_perfil == 'manual' and (ml_type == 'supervisado' or ml_type == 'hibrido') }}"

# --- Boosting opcional (solo supervisado e hibrido) ---
use_xgboost:
  type: bool
  help: "Añadir XGBoost a _build_models()?"
  default: "{{ proyecto_perfil == 'completo' }}"
  when: "{{ proyecto_perfil == 'manual' and (ml_type == 'supervisado' or ml_type == 'hibrido') }}"

use_lightgbm:
  type: bool
  help: "Añadir LightGBM a _build_models()?"
  default: "{{ proyecto_perfil == 'completo' }}"
  when: "{{ proyecto_perfil == 'manual' and (ml_type == 'supervisado' or ml_type == 'hibrido') }}"

use_catboost:
  type: bool
  help: "Añadir CatBoost a _build_models()? (boosting nativo para categoricas)"
  default: "{{ proyecto_perfil == 'completo' }}"
  when: "{{ proyecto_perfil == 'manual' and (ml_type == 'supervisado' or ml_type == 'hibrido') }}"

# --- Licencia y versiones ---
project_open_source_license:
  type: str
  help: "Licencia del proyecto"
  choices:
    - No license file
    - MIT
    - BSD-3-Clause
    - Apache-2.0
  default: No license file

python_version:
  type: str
  help: "Version de Python"
  choices:
    - "3.10"
    - "3.11"
    - "3.12"
    - "3.13"
  default: "3.12"

dskit_version:
  type: str
  default: "1.16.0"
  help: "Versión de dskit que generó el proyecto (no cambiar)"

project_version:
  type: str
  default: "0.1.0"
  help: "Version inicial del proyecto"

# --- Tareas post-generacion ---

_message_before_copy: >-
  {% if use_api and ml_type == 'no_supervisado' %}
    AVISO: use_api=yes con ml_type=no_supervisado — el endpoint /predict
  devuelve cluster asignado. Asegúrate de que predict_model.py tiene el método predict().
  {% endif %}
  {% if graphify_mode == "graphify + obsidian vault" %}
    graphify + Obsidian vault generados. Abre docs/vault/ en Obsidian para explorar el grafo de conocimiento.
  {% elif graphify_mode == "solo graphify" %}
    graphify activado. Ejecuta 'uv run python -m graphify build' para generar el grafo de conocimiento.
  {% endif %}
  {% if use_rag %}
    RAG + corpus de conocimiento profundo activos (docs/knowledge/). Consulta con
    'run rag search --file_type knowledge'; mantén las fuentes con 'run rag refresh'.
  {% endif %}
  {% if use_demo %}
    Demo activa (demo/). Flujo: make train → make demo-export → sirve con
    make demo-serve. Es un directorio local, sin auto-deploy.
  {% endif %}
  {% if proyecto_perfil == 'completo' or proyecto_perfil == 'manual' %}
    NOTA: se instalaron las dependencias automáticamente (perfil {{ proyecto_perfil }}).
  {% else %}
    NOTA: no se instalan dependencias automáticamente. Ejecuta `make setup` cuando
  quieras tener el entorno listo (perfil {{ proyecto_perfil }}).
  {% endif %}
  Generando proyecto '{{ project_name }}' ({{ ml_type }})...

_tasks:
  # El arnés arranca con init.sh — asegura el bit de ejecución en el destino.
  - "chmod +x init.sh"
  # La instalación de dependencias es opt-in: solo en completo/manual. En
  # minimo/estandar el proyecto nace sin venv y `make setup` lo instala.
  - >-
    {% if proyecto_perfil == 'completo' or proyecto_perfil == 'manual' %}
    uv sync --extra dev --extra {{ ml_type }}
    {% if use_mlflow %}--extra mlflow_tracking{% endif %}
    {% if graphify_mode != 'no' %}--extra graphify{% endif %}
    {% if use_api %}--extra api{% endif %}
    {% if use_duckdb %}--extra duckdb{% endif %}
    {% if use_optuna %}--extra optuna{% endif %}
    {% if use_monitoring %}--extra monitoring{% endif %}
    {% if use_rag %}--extra rag{% endif %}
    {% if use_demo %}--extra onnx{% endif %}
    && uv run python -c 'import sklearn; print("scikit-learn OK")'
    {% if ml_type == 'redes_neuronales' %}
    && uv run python -c 'import torch; print("torch", torch.__version__)'
    {% endif %}
    {% if graphify_mode != 'no' %}
    && uv run python -c 'import importlib.metadata as m; import graphify; print("graphify", m.version("graphifyy"))'
    {% endif %}
    {% if use_optuna %}
    && uv run python -c 'import optuna; print("optuna", optuna.__version__)'
    {% endif %}
    {% if use_monitoring %}
    && uv run python -c 'import evidently; print("evidently", evidently.__version__)'
    {% endif %}
    {% if use_rag %}
    && uv run python -c 'import chromadb; print("chromadb OK")'
    {% endif %}
    {% endif %}
  # Los prompts llevan un bloque derivado del código y de contracts.py, y los
  # subagentes se espejan a .claude/: se genera aquí para que el proyecto nazca
  # al día. NO es bloqueante a propósito — es una comodidad, y quedarse sin
  # poder generar el proyecto por ella sería mucho peor que generarlo sin los
  # bloques. Si falla, `make prompts-sync` lo arregla.
  - >-
    uv run python -m agents.prompts_sync --write
    || echo "  (aviso: no se pudieron generar los bloques de los prompts — ejecuta 'make prompts-sync')"

_exclude:
  - "**/.gitkeep"
  # Lo que los agentes generan en runtime (logs de auditoría, eventos de
  # gstack, órdenes de trabajo...) nunca debe viajar del template al proyecto
  # generado — solo .gitignore y README.md viven directamente en workspace/.
  - "agents/workspace/*/"
  - "{% if not use_api %}api{% endif %}"
  - "{% if not use_api %}tests/test_api.py{% endif %}"
  - "{% if not use_optuna %}tools/tune_model.py{% endif %}"
  - "{% if not use_optuna %}tests/test_tuning.py{% endif %}"
  - "{% if not use_monitoring %}tools/monitor.py{% endif %}"
  - "{% if not use_monitoring %}tests/test_monitoring.py{% endif %}"
  - "{% if not use_docker %}chat{% endif %}"
  - "{% if not use_docker %}Dockerfile{% endif %}"
  - "{% if not use_docker %}docker-compose.yml{% endif %}"
  - "{% if not use_docker %}.dockerignore{% endif %}"
  - "{% if not use_api %}agents/prompts/api_workflow.md{% endif %}"
  - "{% if not use_docker %}agents/prompts/docker_workflow.md{% endif %}"
  - "{% if not use_monitoring %}agents/prompts/monitoring_workflow.md{% endif %}"
  - "{% if not use_optuna %}agents/prompts/optuna_workflow.md{% endif %}"
  - "{% if graphify_mode == 'no' %}agents/prompts/knowledge_workflow.md{% endif %}"
  - "{% if graphify_mode != 'graphify + obsidian vault' %}docs/vault{% endif %}"
  - "{% if not use_rag %}agents/prompts/rag_workflow.md{% endif %}"
  - "{% if not use_rag %}agents/agents/rag_agent.py{% endif %}"
  - "{% if not use_rag %}agents/tools/rag_tool.py{% endif %}"
  - "{% if not use_rag %}agents/prompts/rag_agent.md{% endif %}"
  - "{% if not use_rag %}agents/tests/test_rag_agent.py{% endif %}"
  - "{% if not use_rag %}agents/evals/rag_eval.py{% endif %}"
  - "{% if not use_rag %}agents/evals/rag_golden.json{% endif %}"
  - "{% if not use_rag %}agents/tests/test_rag_eval.py{% endif %}"
  - "{% if not use_rag %}agents/tests/test_rag_trust.py{% endif %}"
  - "{% if not use_rag %}docs/knowledge{% endif %}"
  - "{% if not use_api %}docs/knowledge/backend/api.md{% endif %}"
  - "{% if not use_docker %}docs/knowledge/backend/docker.md{% endif %}"
  - "{% if not use_docker %}docs/knowledge/frontend/chat.md{% endif %}"
  - "{% if not use_mlflow %}docs/knowledge/backend/mlflow.md{% endif %}"
  - "{% if not use_mcp %}.mcp.json{% endif %}"
  - "{% if not use_demo %}tools/export_onnx.py{% endif %}"
  - "{% if not use_demo %}demo{% endif %}"
  - "{% if not use_demo %}tests/test_export_onnx.py{% endif %}"
  - "{% if not use_mcp %}demo/mcp.html{% endif %}"
  - "{% if not use_sdd %}tools/mutate.py{% endif %}"
  - "{% if not use_sdd %}agents/agents/mutation_agent.py{% endif %}"
  - "{% if not use_sdd %}agents/tools/mutation_tool.py{% endif %}"
  - "{% if not use_sdd %}agents/prompts/mutation_agent.md{% endif %}"
  - "{% if not use_sdd %}agents/tests/test_mutation_agent.py{% endif %}"
  - "{% if not use_sdd %}features/*{% endif %}"
  # --- Gating de agentes por extra: el agente solo existe si su feature está activa ---
  - "{% if not use_api %}agents/agents/api_agent.py{% endif %}"
  - "{% if not use_api %}agents/prompts/api_agent.md{% endif %}"
  - "{% if not use_api %}agents/tests/test_api_agent.py{% endif %}"
  - "{% if not use_docker %}agents/agents/docker_agent.py{% endif %}"
  - "{% if not use_docker %}agents/prompts/docker_agent.md{% endif %}"
  - "{% if not use_docker %}agents/tests/test_docker_agent.py{% endif %}"
  - "{% if not use_docker %}agents/tests/test_docker_tool.py{% endif %}"
  - "{% if not use_mlflow %}agents/agents/mlflow_agent.py{% endif %}"
  - "{% if not use_mlflow %}agents/prompts/mlflow_agent.md{% endif %}"
  - "{% if not use_mlflow %}agents/tests/test_mlflow_agent.py{% endif %}"
  - "{% if graphify_mode == 'no' %}agents/agents/knowledge_agent.py{% endif %}"
  - "{% if graphify_mode == 'no' %}agents/prompts/knowledge_agent.md{% endif %}"
  - "{% if graphify_mode == 'no' %}agents/tests/test_knowledge_agent.py{% endif %}"
  # --- Poda de periféricos: agentes de equipo/competición solo en completo/manual ---
  - "{% if proyecto_perfil in ['minimo', 'estandar'] %}agents/agents/installer_agent.py{% endif %}"
  - "{% if proyecto_perfil in ['minimo', 'estandar'] %}agents/prompts/installer_agent.md{% endif %}"
  - "{% if proyecto_perfil in ['minimo', 'estandar'] %}agents/tests/test_installer_agent.py{% endif %}"
  - "{% if proyecto_perfil in ['minimo', 'estandar'] %}agents/agents/supervisor_agent.py{% endif %}"
  - "{% if proyecto_perfil in ['minimo', 'estandar'] %}agents/prompts/supervisor_agent.md{% endif %}"
  - "{% if proyecto_perfil in ['minimo', 'estandar'] %}agents/tests/test_supervisor_agent.py{% endif %}"
  - "{% if proyecto_perfil in ['minimo', 'estandar'] %}agents/agents/research_agent.py{% endif %}"
  - "{% if proyecto_perfil in ['minimo', 'estandar'] %}agents/prompts/research_agent.md{% endif %}"
  - "{% if proyecto_perfil in ['minimo', 'estandar'] %}agents/tests/test_research_agent.py{% endif %}"
  - "{% if proyecto_perfil in ['minimo', 'estandar'] %}agents/tests/test_research_tool.py{% endif %}"
  - "{% if proyecto_perfil in ['minimo', 'estandar'] %}agents/agents/audit_agent.py{% endif %}"
  - "{% if proyecto_perfil in ['minimo', 'estandar'] %}agents/prompts/audit_agent.md{% endif %}"
  - "{% if proyecto_perfil in ['minimo', 'estandar'] %}agents/tests/test_audit_agent.py{% endif %}"
  - "{% if proyecto_perfil in ['minimo', 'estandar'] %}agents/tests/test_audit.py{% endif %}"

_subdirectory: template
_templates_suffix: ""
